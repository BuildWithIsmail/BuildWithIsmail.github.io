<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status | Rise</title>
    <style>
        :root {
            --bg-color: #030303; 
            --card-bg: #0A0A0A; 
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --accent-green: #00FF66;
            --accent-glow: rgba(0, 255, 102, 0.15);
            --border-color: #1a1a1a; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* SILKY BACKGROUND MESH (Subtle Dark Teal/Green tint for status) */
        .background-blob {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 102, 51, 0.15) 0, transparent 55%), 
                radial-gradient(at 90% 90%, rgba(0, 50, 30, 0.2) 0, transparent 60%);
            filter: blur(100px);
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }

        /* STATUS CARD HOLDER */
        .status-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: clamp(320px, 90%, 550px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        /* HEADER & RADAR ANIMATION */
        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .title-group p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Live Pulsing Green Node */
        .status-indicator {
            position: relative;
            width: 14px;
            height: 14px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .status-indicator::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            width: 26px;
            height: 26px;
            border: 2px solid var(--accent-green);
            border-radius: 50%;
            opacity: 0;
            animation: radarPulse 2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
        }

        @keyframes radarPulse {
            0% { transform: scale(0.3); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* STATUS METRICS GRID */
        .systems-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .system-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
        }

        .system-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .system-status {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* BUTTONS */
        .btn-back {
            display: block;
            text-align: center;
            text-decoration: none;
            background-color: #ffffff;
            color: #000000;
            padding: 14px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-back:hover {
            transform: scale(1.01);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="background-blob"></div>
    <div class="grain-overlay"></div>

    <div class="status-container">
        <div class="status-header">
            <div class="title-group">
                <h1>All Systems Operational</h1>
                <p>Rise platform status metrics</p>
            </div>
            <div class="status-indicator"></div>
        </div>

        <div class="systems-list">
            <div class="system-item">
                <span class="system-name">Hosting Server</span>
                <span class="system-status">Operational</span>
            </div>
            <div class="system-item">
                <span class="system-name">GitHub API</span>
                <span class="system-status">Operational</span>
            </div>
            <div class="system-item">
                <span class="system-name">Rise's Engine System</span>
                <span class="system-status">Operational</span>
            </div>
        </div>

        <a href="index.html" class="btn-back">Return to Platform</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildWithIsmail | Portfolio</title>
    <style>
        /* 1. FOUNDATION & APPLE FONT (SAN FRANCISCO) */
        :root {
            --bg-color: #030303; 
            --nav-bg: #0A0A0A; 
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --accent: #007AFF; 
            --nav-border: #1a1a1a; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 2. THE SILKY BACKGROUND */
        .background-blob {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.12) 0%, rgba(255, 255, 255, 0) 60%);
            filter: blur(140px);
            z-index: -2;
            animation: moveBlob 20s ease-in-out infinite alternate;
        }

        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }

        @keyframes moveBlob {
            0% { transform: scale(1) translate(-10%, -10%); }
            100% { transform: scale(1.2) translate(5%, 5%); }
        }

        /* 3. MINIMAL NAVIGATION BAR */
        nav {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--nav-bg);
            border: 1px solid var(--nav-border);
            padding: 12px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            width: fit-content;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.04em;
        }

        .logo svg { width: 24px; height: 24px; fill: white; }

        /* 4. HERO CONTENT & TYPEWRITER */
        .hero-content {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 4.5rem); 
            letter-spacing: -0.05em;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .type-wrap {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            color: var(--text-dim);
            margin-top: 20px;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        #typewriter {
            color: #fff;
            font-weight: 600;
            border-right: 3px solid var(--accent);
            padding-right: 10px;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--accent); }
        }
    </style>
</head>
<body>

    <div class="background-blob"></div>
    <div class="grain-overlay"></div>

    <nav>
        <div class="logo">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="#111" stroke="#333" stroke-width="4"/>
                <path d="M50,15 L60,40 L85,45 L65,60 L70,85 L50,70 L30,85 L35,60 L15,45 L40,40 Z" fill="#fff"/>
            </svg>
            BuildWithIsmail
        </div>
    </nav>

    <div class="hero-content">
        <h1>Hi, I’m BuildWithIsmail</h1>
        <div class="type-wrap">
            I am a <span id="typewriter"></span>
        </div>
    </div>

    <script>
        const textElement = document.getElementById('typewriter');
        const words = ["Developer", "Ui/Ux Designer", "Graphic Designer", "Motion Designer", "Anything"];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function type() {
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                textElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                textElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 60 : 150;

            if (!isDeleting && charIndex === currentWord.length) {
                isDeleting = true;
                typeSpeed = 2500; 
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                typeSpeed = 500;
            }

            setTimeout(type, typeSpeed);
        }

        window.onload = type;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <</title>BuildWithIsmail | RISE</title>
    <style>
        /* 1. FOUNDATION & DARK RED BRANDING */
        :root {
            --bg-color: #030303; 
            --nav-bg: #0A0A0A; 
            --text-main: #FFFFFF;
            --text-dim: #888888;
            /* Precise Dark Red matching the RISE asset */
            --accent-red: #660000; 
            --accent-glow: rgba(102, 0, 0, 0.25);
            --nav-border: #1a1a1a; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 2. SILKY DARK RED BACKGROUND MESH */
        .background-blob {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            /* Blended deep red radial spheres for a liquid silk look */
            background-image: 
                radial-gradient(at 10% 10%, rgba(102, 0, 0, 0.3) 0, transparent 55%), 
                radial-gradient(at 90% 10%, rgba(139, 0, 0, 0.2) 0, transparent 50%), 
                radial-gradient(at 50% 90%, rgba(77, 0, 0, 0.35) 0, transparent 60%);
            filter: blur(100px);
            animation: moveBlob 15s ease-in-out infinite alternate;
        }

        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }

        @keyframes moveBlob {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(2%, 2%); }
        }

        /* 3. MODERN NAVIGATION BAR WITH LOGO AND ABOUT */
        nav {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--nav-bg);
            border: 1px solid var(--nav-border);
            padding: 10px 24px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: clamp(300px, 90%, 500px); 
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 32px;
        }

        .logo-container img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .btn-about {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-about:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--nav-border);
        }

        /* 4. HERO CONTENT & TYPOGRAPHY */
        .hero-content {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 9vw, 4.5rem); 
            letter-spacing: -0.05em;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .type-wrap {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            color: var(--text-dim);
            margin-top: 20px;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        /* Dark Red Typewriter Text & Cursor */
        #typewriter {
            color: var(--accent-red);
            font-weight: 600;
            border-right: 3px solid var(--accent-red);
            padding-right: 10px;
            animation: blink 0.8s step-end infinite;
            text-shadow: 0 0 20px rgba(102, 0, 0, 0.5); /* Subtle glow */
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--accent-red); }
        }
    </style>
</head>
<body>

    <div class="background-blob"></div>
    <div class="grain-overlay"></div>

    <nav>
        <div class="logo-container">
            <img src="rise.png" alt="RISE Logo">
        </div>
        <div class="nav-links">
            <a href="#about" class="btn-about">About</a>
        </div>
    </nav>

    <div class="hero-content">
        <h1>Hi, I’m BuildWithIsmail</h1>
        <div class="type-wrap">
            I am a <span id="typewriter"></span>
        </div>
    </div>

    <script>
        const textElement = document.getElementById('typewriter');
        const words = ["Developer", "Ui/Ux Designer", "Graphic Designer", "Motion Designer"];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function type() {
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                textElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                textElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 60 : 150;

            if (!isDeleting && charIndex === currentWord.length) {
                isDeleting = true;
                typeSpeed = 2500; /* Time the full word stays on screen */
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                typeSpeed = 500;
            }

            setTimeout(type, typeSpeed);
        }

        window.onload = type;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time To Rise</title>
    <style>
        /* 1. BRAND VARIABLES & BASE ACCENTS */
        :root {
            --bg-dark: #030303;
            --nav-bg: #0A0A0A;
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --accent-red: #660000;
            --bright-red: #A30000;
            --nav-border: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 2. DYNAMIC ANIMATED GRADIENT BACKGROUND */
        .animated-gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background-image: 
                radial-gradient(at 20% 20%, rgba(102, 0, 0, 0.4) 0, transparent 50%), 
                radial-gradient(at 80% 30%, rgba(139, 0, 0, 0.25) 0, transparent 45%), 
                radial-gradient(at 50% 80%, rgba(50, 0, 0, 0.5) 0, transparent 60%);
            background-size: 200% 200%;
            filter: blur(80px);
            animation: flowGradients 12s ease-in-out infinite alternate;
        }

        @keyframes flowGradients {
            0% { background-position: 0% 0%; transform: scale(1); }
            50% { background-position: 50% 100%; transform: scale(1.05); }
            100% { background-position: 100% 50%; transform: scale(1); }
        }

        /* 3. TECHNO TECH-RAYS BACKGROUND OVERLAY */
        .ray-grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.15;
            pointer-events: none;
            background: repeating-conic-gradient(
                from 0deg at 50% -20%, 
                transparent 0deg 2deg, 
                var(--bright-red) 3deg 4deg
            );
            mask-image: radial-gradient(circle at 50% 30%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 20%, transparent 80%);
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }

        /* 4. PREMIUM NAVIGATION BAR WITH IMAGE LOGO */
        nav {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--nav-bg);
            border: 1px solid var(--nav-border);
            padding: 10px 24px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: clamp(300px, 90%, 500px); 
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 32px;
        }

        .logo-container img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 8px rgba(102,0,0,0.4));
        }

        .btn-about {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-about:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--nav-border);
        }

        /* 5. MAIN HERO CONTAINER */
        .main-container {
            text-align: center;
            max-width: 750px;
            padding: 140px 24px 60px 24px;
            z-index: 10;
        }

        /* Futuristic Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(102, 0, 0, 0.15);
            border: 1px solid rgba(163, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #FF4D4D;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .status-badge span {
            color: #fff;
            opacity: 0.6;
        }

        .arrow-icon {
            display: inline-flex;
            width: 12px;
            height: 12px;
            background: currentColor;
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>') no-repeat center;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>') no-repeat center;
        }

        /* High-End Clean Typography */
        h1 {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: clamp(1.05rem, 3vw, 1.25rem);
            line-height: 1.6;
            color: var(--text-dim);
            font-weight: 400;
            margin-bottom: 20px;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
        }

        .tagline {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(163, 0, 0, 0.4);
        }

        /* 6. APPLE STYLE CALL-TO-ACTION BUTTONS */
        .cta-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .btn-white {
            background-color: #ffffff;
            color: #000000;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-white:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .btn-dark {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--nav-border);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .btn-dark:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: #444;
        }
    </style>
</head>
<body>

    <div class="animated-gradient-bg"></div>
    <div class="ray-grid-overlay"></div>
    <div class="grain-overlay"></div>

    <nav>
        <div class="logo-container">
            <img src="rise.png" alt="RISE Logo">
        </div>
        <div class="nav-links">
            <a href="about.html" class="btn-about">About</a>
        </div>
    </nav>

    <main class="main-container">
        <div class="status-badge">
            <span>New:</span> 2026 June Update <div class="arrow-icon"></div>
        </div>

        <h1>Time To Rise</h1>
        
        <p class="description">
            Step into a high-octane digital platform where websites transform into living, reactive environments. Introducing Rise: a portal built entirely out of pure experience, interaction, and raw fluid motion.
        </p>
        
        <div class="tagline">Let’s Explore the future</div>

        <div class="cta-group">
            <a href="#" class="btn-white">Explore Now!</a>
            <a href="#" class="btn-dark">Learn More</a>
        </div>
    </main>

</body>
</html>
